[build-system]
requires = ["setuptools", "ChimeraX-BundleBuilder"]
build-backend = "chimerax.bundle_builder.cx_bundle_builder"

[project]
name = "ChimeraX-ResViewX"
version = "1.0"
description = "ResViewX: global, local and directional resolution of cryo-EM maps"
dynamic = ["classifiers"]
requires-python = ">=3.7"

[tool.chimerax]
min-session-version = 1
max-session-version = 1
custom-init = true
categories = ["Volume Data"]

[tool.chimerax.command.fsc]
category = "Volume Data"
synopsis = "Compute FSC between two half-maps and display the plot"

[tool.chimerax.tool."ResViewX"]
category = "Volume Data"
synopsis = "Global (FSC), local (MonoRes) and directional (FSO) resolution panel"
